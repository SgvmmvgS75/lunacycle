<!-- ============ ENGINE: modulo matematico/statistico isolato (nessun accesso al DOM, nessun testo localizzato) ============ -->
<script id="engine">
const CycleEngine=(()=>{
const DAY=864e5, BLEED=['leggero','medio','abbondante'], MINCYCLE=15;
const p=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const f=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const d=p(s);d.setDate(d.getDate()+n);return f(d)};
const diff=(a,b)=>Math.round((p(a)-p(b))/DAY);
// z per intervallo bilaterale (Abramowitz-Stegun 26.2.23)
function zScore(conf){const q=(1-conf)/2,t=Math.sqrt(-2*Math.log(q));return t-(2.515517+.802853*t+.010328*t*t)/(1+1.432788*t+.189269*t*t+.001308*t**3)}
// Inizio mestruazione = primo giorno con flusso >= leggero (lo spotting non conta).
// Nuovo ciclo se: pausa > 3 gg dall'ultimo giorno di flusso E almeno MINCYCLE gg dall'ultimo inizio
// (così un diario con giorni saltati durante le mestruazioni non spezza il ciclo in due).
function periodStarts(logs){let last=null,lastStart=null;const st=[];Object.keys(logs).sort().forEach(d=>{if(BLEED.includes(logs[d].flow)){if(last===null||(diff(d,last)>3&&diff(d,lastStart)>=MINCYCLE)){st.push(d);lastStart=d}last=d}});return st}
// Ovulazione: LH+ (+1 gg) > rialzo BBT (regola 3 su 6) > ultimo giorno muco chiara d'uovo
// method: 'lh' | 'bbt' | 'mucus'
function detect(logs,s,e){
  const days=Object.keys(logs).filter(d=>d>=s&&d<e).sort();
  const lh=days.find(d=>logs[d].lh==='positivo');
  const T=days.filter(d=>+logs[d].temp>0);let shift=null;
  for(let i=6;i<T.length-2;i++){
    const base=Math.max(...T.slice(i-6,i).map(d=>+logs[d].temp));
    const h=[0,1,2].map(k=>+logs[T[i+k]].temp);
    if(h.every(x=>x>base)&&h[2]>=base+.2){shift={first:T[i],cover:+(base+.05).toFixed(2),ov:add(T[i],-1)};break}
  }
  // Il muco chiara d'uovo conta come ovulazione solo dopo il "picco": serve un giorno successivo con muco meno fertile
  const pk=days.filter(d=>logs[d].mucus==='chiara_uovo').pop();
  const peak=pk&&days.some(d=>d>pk&&logs[d].mucus&&logs[d].mucus!=='chiara_uovo'&&logs[d].mucus!=='acquoso')?pk:undefined;
  let r=null;
  if(lh)r={date:add(lh,1),method:'lh'};else if(shift)r={date:shift.ov,method:'bbt'};else if(peak)r={date:peak,method:'mucus'};
  if(!r&&!shift)return null;
  return r?{...r,shift,lh,peak,bbtConfirmed:!!shift}:{date:null,shift};
}
function analyze(logs,S,today){
  const starts=periodStarts(logs);
  // data manuale: usata se non c'è storico, oppure se è una mestruazione più recente dell'ultima registrata
  if(S.lastPeriodDate&&S.lastPeriodDate<=today&&(!starts.length||diff(S.lastPeriodDate,starts[starts.length-1])>=MINCYCLE))starts.push(S.lastPeriodDate);
  const cycles=[];
  for(let i=0;i<starts.length-1;i++){
    const s=starts[i],e=starts[i+1],len=diff(e,s),o=detect(logs,s,e),auto=len<21||len>45,man=S.anomalous[s];
    cycles.push({start:s,end:e,len,auto,anomalous:man===undefined?auto:man,ov:o&&o.date,method:o&&o.date?o.method:null,luteal:o&&o.date?diff(e,o.date):null});
  }
  const L=cycles.filter(c=>!c.anomalous).map(c=>c.len),n=L.length,al=S.alpha;
  let ema=n?L[0]:S.cycleLength;for(let i=1;i<n;i++)ema=al*L[i]+(1-al)*ema;   // EMA: peso maggiore ai cicli recenti
  let sd0=2.5;
  if(n>=2){const w=L.map((_,i)=>Math.pow(1-al,n-1-i)),sw=w.reduce((a,b)=>a+b),m=L.reduce((a,x,i)=>a+w[i]*x,0)/sw;sd0=Math.sqrt(L.reduce((a,x,i)=>a+w[i]*(x-m)**2,0)/sw)}
  const sd=Math.sqrt((n*sd0*sd0+2*6.25)/(n+2));  // shrinkage verso prior con pochi dati
  // fase luteale individuale. src: {k:'std'|'manual'|'measured',n}
  const lv=cycles.filter(c=>!c.anomalous&&c.luteal>=8&&c.luteal<=20).map(c=>c.luteal);
  let lut=14,lsd=1.5,src={k:'std'};
  if(S.lutealMode==='manual'){lut=S.lutealManual;lsd=1;src={k:'manual'}}
  else if(lv.length){const k=lv.length,sum=lv.reduce((a,b)=>a+b,0),m=sum/k;lut=(sum+Math.max(0,3-k)*14)/Math.max(3,k);lsd=Math.max(1,k>1?Math.sqrt(lv.reduce((a,x)=>a+(x-m)**2,0)/(k-1)):1.5);src={k:'measured',n:k}}

  // Fattori di variabilità legati a età e BMI
  let ageFactor=1.0,weightFactor=1.0;
  const age=parseFloat(S.age);
  if(age>0){
    if(age<19)ageFactor=1.0+(19-age)*0.015;                 // adolescenza
    else if(age>=35&&age<40)ageFactor=1.0+(age-35)*0.02;    // premenopausa precoce
    else if(age>=40)ageFactor=1.1+(age-40)*0.03;            // premenopausa avanzata
    if(ageFactor>2.0)ageFactor=2.0;
  }
  const wt=parseFloat(S.weight),ht=parseFloat(S.height);
  if(wt>0&&ht>0){
    const hm=ht/100,bmi=wt/(hm*hm);
    if(bmi<18.5)weightFactor=1.0+(18.5-bmi)*0.02;
    else if(bmi>24.9)weightFactor=1.0+(bmi-24.9)*0.015;
    if(weightFactor>1.5)weightFactor=1.5;
  }
  const finalSD=sd*ageFactor*weightFactor;

  const out={today,starts,cycles,ema,sd:finalSD,n,lut,lsd,src,z:zScore(S.confidence),pred:null,segs:[]};
  const cur=starts[starts.length-1];if(!cur)return out;
  const Lr=Math.round(lut),co=detect(logs,cur,add(today,1)),conf=!!(co&&co.date);
  let next,sig,ov;
  if(conf){ov=co.date;next=add(ov,Lr);sig=Math.sqrt(lsd*lsd+.5)}
  else{next=add(cur,Math.round(ema));sig=finalSD*Math.sqrt(1+1/(n+1));ov=add(next,-Lr)}
  const w=Math.max(1,Math.ceil(out.z*sig)),ow=conf?0:Math.max(1,Math.ceil(out.z*finalSD));
  out.pred={cur,next,sigma:sig,w,ci:[add(next,-w),add(next,w)],ov,ovCi:[add(ov,-ow),add(ov,ow)],ovConfirmed:conf,method:conf?co.method:null,bbtConfirmed:!!(co&&co.bbtConfirmed),
    fertile:[add(ov,-5),add(ov,1)],pms:[add(next,-5),add(next,-1)],late:Math.max(0,diff(today,next)),shift:co&&co.shift};
  cycles.forEach(c=>out.segs.push({s:c.start,e:c.end,ov:c.ov||add(c.end,-Lr)}));
  out.segs.push({s:cur,e:next,ov});
  let s=next;
  // Ritardo: la data prevista è passata senza flusso registrato -> i giorni di ritardo restano "premestruali" e la proiezione riparte da domani
  if(next<=today){out.segs.push({s:next,e:add(today,1),ov});s=add(today,1)}
  for(let i=0;i<9;i++){const e=add(s,Math.max(15,Math.round(ema)));out.segs.push({s,e,ov:add(e,-Lr)});s=e}
  return out;
}
function phase(a,S,date){
  const g=a.segs.find(x=>x.s<=date&&date<x.e);if(!g)return null;
  // Ritardo: la data prevista è passata ma nessun flusso è stato registrato -> le mestruazioni non sono iniziate
  if(a.pred&&g.s===a.pred.next&&date<=a.today){const c=a.pred.cur;return{ph:'pms',day:diff(date,c)+1,len:diff(a.pred.next,c),ov:a.pred.ov}}
  const day=diff(date,g.s)+1,len=diff(g.e,g.s);let ph;
  if(day<=S.periodLength)ph='mestruale';else if(date===g.ov)ph='ovulazione';
  else if(date>=add(g.ov,-5)&&date<=add(g.ov,1))ph='fertile';else if(date<g.ov)ph='follicolare';
  else if(date>=add(g.e,-5))ph='pms';else ph='luteale';
  return{ph,day,len,ov:g.ov};
}
return{analyze,phase,add,diff,f,p,zScore,periodStarts,detect};
})();
</script>

<script>
const E=CycleEngine,$=id=>document.getElementById(id);
const FLOW=['assente','spotting','leggero','medio','abbondante'],MUC=['asciutto','appiccicoso','cremoso','acquoso','chiara_uovo'];
const SYM=['cramps','headache','bloating','breast','acne','fatigue','cravings','backpain','nausea'];
const SYMLEG={'Crampi':'cramps','Mal di testa':'headache','Gonfiore':'bloating','Seno teso':'breast','Acne':'acne','Stanchezza':'fatigue','Voglie':'cravings','Dolori lombari':'backpain','Nausea':'nausea'};
const ACT=['nessuna','leggera','moderata','intensa'],MOOD=['😊','😐','😢','😠','😰'],CONFS=[.8,.9,.92,.95];
const DEF={cycleLength:28,periodLength:5,lutealMode:'auto',lutealManual:14,alpha:.35,confidence:.92,lastPeriodDate:'',anomalous:{},age:'',weight:'',height:'',lang:'auto'};

// ---------- i18n ----------
let L='it';
const resolveLang=()=>S.lang==='it'||S.lang==='en'?S.lang:(String(navigator.language||'').toLowerCase().startsWith('it')?'it':'en');
const loc=()=>L==='it'?'it-IT':'en-GB';
const t=(k,p)=>{let s=I18N[L][k];if(s===undefined)s=I18N.en[k];if(s===undefined)return k;if(typeof s!=='string')return s;return p?s.replace(/\{(\w+)\}/g,(m,x)=>p[x]!==undefined?p[x]:m):s};
const pl=(k,n)=>t(k+(n===1?'.one':'.other'),{n});
function applyLang(){L=resolveLang();document.documentElement.lang=L;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n))}

// ---------- dati ----------
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&E.f(E.p(d))===d;
const num=(v,a,b)=>{const x=parseFloat(v);return isFinite(x)&&x>=a&&x<=b?x:null};
function cleanLogs(o){const r={};if(!o||typeof o!=='object'||Array.isArray(o))return r;
  Object.keys(o).forEach(d=>{const l=o[d];if(!validDate(d)||!l||typeof l!=='object')return;const tp=num(l.temp,30,45);
    r[d]={flow:FLOW.includes(l.flow)?l.flow:'',temp:tp===null?'':tp,lh:l.lh==='negativo'||l.lh==='positivo'?l.lh:'',mucus:MUC.includes(l.mucus)?l.mucus:'',
      stress:num(l.stress,1,5)||3,sleep:num(l.sleep,1,5)||3,activity:ACT.includes(l.activity)?l.activity:'nessuna',meds:String(l.meds==null?'':l.meds).slice(0,200),
      symptoms:(Array.isArray(l.symptoms)?l.symptoms:[]).map(x=>SYMLEG[x]||x).filter(x=>SYM.includes(x)),mood:MOOD.includes(l.mood)?l.mood:'',
      notes:String(l.notes==null?'':l.notes).slice(0,2000),intercourse:l.intercourse==='no'||l.intercourse==='si'?l.intercourse:''}});
  return r}
function cleanSet(o){o=o&&typeof o==='object'?o:{};const s={...DEF};
  s.cycleLength=Math.round(num(o.cycleLength,21,45)||DEF.cycleLength);s.periodLength=Math.round(num(o.periodLength,2,9)||DEF.periodLength);
  s.lutealMode=o.lutealMode==='manual'?'manual':'auto';s.lutealManual=Math.round(num(o.lutealManual,10,16)||DEF.lutealManual);
  s.alpha=num(o.alpha,.1,.7)||DEF.alpha;s.confidence=CONFS.includes(+o.confidence)?+o.confidence:DEF.confidence;
  s.lastPeriodDate=validDate(o.lastPeriodDate)?o.lastPeriodDate:'';
  s.anomalous={};if(o.anomalous&&typeof o.anomalous==='object')Object.keys(o.anomalous).forEach(k=>{if(validDate(k))s.anomalous[k]=!!o.anomalous[k]});
  const a=num(o.age,13,55),w=num(o.weight,30,200),h=num(o.height,100,220);s.age=a===null?'':a;s.weight=w===null?'':w;s.height=h===null?'':h;
  s.lang=o.lang==='it'||o.lang==='en'?o.lang:'auto';return s}
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let logs=cleanLogs(ld('lc4_logs',{})),S=cleanSet(ld('lc4_set',{}));
const saveState=()=>{try{localStorage.setItem('lc4_logs',JSON.stringify(logs));localStorage.setItem('lc4_set',JSON.stringify(S))}catch(e){}};
let today=E.f(new Date());let tab='oggi',calD=new Date(),dDate=today,A;
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'LunaCycle',v:1,logs,settings:S},null,1)],{type:'application/json'}));a.download='lunacycle-backup-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=='LunaCycle'||!d.logs||typeof d.logs!=='object'||!d.settings||typeof d.settings!=='object')throw 0;
    if(!confirm(t('confirm.import'))){inp.value='';return}
    logs=cleanLogs(d.logs);S=cleanSet(d.settings);saveState();applyLang();render();toast(t('toast.imported'))}catch(e){toast(t('toast.badfile'))}inp.value=''};
  r.onerror=()=>{toast(t('toast.badfile'));inp.value=''};r.readAsText(f)}

// ---------- utilità UI ----------
const PHC={mestruale:'#ff4081',follicolare:'#b388ff',fertile:'#4dd0e1',ovulazione:'#26e0c4',luteale:'#7e57c2',pms:'#ffb300'};
const fd=(s,o)=>E.p(s).toLocaleDateString(loc(),o||{day:'numeric',month:'short'});
const rng=r=>r[0]===r[1]?fd(r[0]):fd(r[0])+' – '+fd(r[1]);
let toastT;const toast=m=>{const el=$('toast');el.textContent=m;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2200)};
function go(x){tab=x;['oggi','calendario','diario','stats','impost'].forEach(k=>$('v-'+k).classList.toggle('hidden',k!==x));document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.t===x;b.classList.toggle('act',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
const srcText=s=>s.k==='manual'?t('lut.manual'):s.k==='measured'?pl('lut.measured',s.n):t('lut.std');

function advice(ph,l){
  const x=[...(t('advice.'+ph)||[])];
  if(l){if(+l.stress>=4)x.push(t('advice.stressHigh'));if(+l.stress<=2)x.push(t('advice.stressLow'));if(+l.sleep&&+l.sleep<=2)x.push(t('advice.sleepLow'));if(l.mucus==='chiara_uovo')x.push(t('advice.eggwhite'))}
  else x.push(t('advice.none'));return x;
}

function bbtChart(a){
  const cur=a.pred.cur,pts=Object.keys(logs).filter(d=>d>=cur&&+logs[d].temp>0).sort().slice(-28).map(d=>[d,+logs[d].temp]);
  if(pts.length<2)return `<p class="sub py-6 text-center">${t('bbt.need')}</p>`;
  const W=340,H=130,mn=Math.min(...pts.map(q=>q[1]))-.1,mx=Math.max(...pts.map(q=>q[1]))+.1,X=i=>12+i*(W-24)/Math.max(1,pts.length-1),Y=v=>H-14-(v-mn)/(mx-mn)*(H-30);
  const sh=a.pred.shift;let g='';
  if(sh&&sh.cover>=mn&&sh.cover<=mx)g+=`<line x1="0" x2="${W}" y1="${Y(sh.cover)}" y2="${Y(sh.cover)}" stroke="#ffb300" stroke-dasharray="4 3"/><text x="${W-4}" y="${Y(sh.cover)-3}" fill="#ffb300" font-size="9" text-anchor="end">${t('bbt.cover',{v:sh.cover})}</text>`;
  g+=`<polyline fill="none" stroke="#b388ff" stroke-width="2" points="${pts.map((q,i)=>X(i)+','+Y(q[1])).join(' ')}"/>`;
  pts.forEach((q,i)=>{const hi=sh&&q[0]>=sh.first;g+=`<circle cx="${X(i)}" cy="${Y(q[1])}" r="3.5" fill="${hi?'#ff4081':'#b388ff'}"/>`;
    if(i%4===0||i===pts.length-1)g+=`<text x="${X(i)}" y="${H-1}" font-size="9" fill="#9a9aa8" text-anchor="middle">${fd(q[0],{day:'numeric',month:'numeric'})}</text>`;
    if(a.pred.ovConfirmed&&q[0]===a.pred.ov)g+=`<text x="${X(i)}" y="12" font-size="10" fill="#26e0c4" text-anchor="middle">${t('bbt.ov')}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full">${g}</svg><p class="sub">${sh?t('bbt.shift',{d:fd(sh.first)}):t('bbt.noshift')}</p>`;
}

function renderOggi(){
  const el=$('v-oggi');
  if(!A.pred){el.innerHTML=`<div class="card text-center space-y-3"><p class="font-semibold">${t('today.start.title')}</p><p class="sub">${t('today.start.text')}</p><div class="flex gap-2 justify-center"><button class="btn" onclick="go('impost')">${t('today.start.btn')}</button></div></div>`;return}
  const P=A.pred,ph=E.phase(A,S,today),key=ph?ph.ph:'follicolare',nm=t('ph.'+key),col=PHC[key],cd=ph?ph.day:1,len=ph?ph.len:28,dl=E.diff(P.next,today);
  const sub=P.late>P.w?pl('today.late',P.late):dl===0?t('today.due'):dl>0?pl('today.in',dl):t('today.expected');
  const tl=logs[today],pct=Math.round(S.confidence*100),u=t('u.days');
  el.innerHTML=`
  <div class="card text-center space-y-4">
    <div class="relative w-64 h-64 mx-auto"><svg viewBox="0 0 100 100" class="w-full h-full" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="42" stroke="#27272f" stroke-width="6" fill="none"/><circle cx="50" cy="50" r="42" stroke="${col}" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="264" stroke-dashoffset="${264*(1-Math.min(1,cd/len))}" style="transition:stroke-dashoffset .8s"/></svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center px-6"><p class="sub">${t('today.day',{d:cd,l:len})}</p><h2 class="text-2xl font-bold" style="color:${col}">${nm}</h2><p class="text-sm mt-1">${sub}</p></div></div>
    <div class="grid grid-cols-2 gap-2 text-left text-xs" style="background:var(--bg);border-radius:1rem;padding:.75rem">
      <div><span class="sub">${t('today.next',{p:pct})}</span><p class="font-bold text-sm">${rng(P.ci)}</p></div>
      <div class="text-right"><span class="sub">${t('today.sigma')}</span><p class="font-bold text-sm" style="color:var(--pink)">± ${P.sigma.toFixed(1)} ${u}</p></div>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div class="card"><p class="sub">${P.ovConfirmed?t('today.ov.c'):t('today.ov.e')}</p><p class="font-bold">${P.ovConfirmed?fd(P.ov):rng(P.ovCi)}</p><p class="sub">${P.method?t('method.'+P.method):t('method.cal')}</p></div>
    <div class="card"><p class="sub">${t('today.fertile')}</p><p class="font-bold">${rng(P.fertile)}</p><p class="sub">${t('today.fertile.sub')}</p></div>
    <div class="card"><p class="sub">${t('today.pms')}</p><p class="font-bold">${rng(P.pms)}</p><p class="sub">${t('today.pms.sub')}</p></div>
    <div class="card"><p class="sub">${t('today.lut')}</p><p class="font-bold">${t('today.lut.val',{v:A.lut.toFixed(1)})}</p><p class="sub">${srcText(A.src)}</p></div>
  </div>
  <div class="card space-y-2"><div class="flex justify-between"><h3 class="font-semibold text-sm">${t('bbt.title')}</h3><span class="sub">${t('bbt.cur')}</span></div>${bbtChart(A)}</div>
  <div class="card space-y-2"><h3 class="font-semibold text-sm">${t('advice.title')}</h3><ul class="space-y-1 text-sm">${advice(key,tl).map(x=>'<li>• '+esc(x)+'</li>').join('')}</ul><button class="btn w-full mt-2" onclick="openDiary('${today}')">${t('advice.log')}</button></div>`;
}

function renderCal(){
  const y=calD.getFullYear(),m=calD.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=`<div class="card"><div class="flex justify-between items-center mb-3"><button class="btn2" aria-label="‹" onclick="calD=new Date(${y},${m-1},1);render()">‹</button><b class="capitalize">${first.toLocaleDateString(loc(),{month:'long',year:'numeric'})}</b><button class="btn2" aria-label="›" onclick="calD=new Date(${y},${m+1},1);render()">›</button></div><div class="grid grid-cols-7 gap-1 text-center text-xs">`;
  for(let i=0;i<7;i++)h+=`<span class="sub">${new Date(2024,0,1+i).toLocaleDateString(loc(),{weekday:'narrow'})}</span>`;   // 1 gen 2024 = lunedì
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let d=1;d<=n;d++){
    const ds=E.f(new Date(y,m,d)),ph=A.pred?E.phase(A,S,ds):null,lg=logs[ds],bleed=lg&&['leggero','medio','abbondante'].includes(lg.flow);
    const col=ph?PHC[ph.ph]:'#444444',inCI=A.pred&&ds>=A.pred.ci[0]&&ds<=A.pred.ci[1]&&ds>=today;
    h+=`<button onclick="openDiary('${ds}')" class="aspect-square rounded-full relative" style="background:${bleed?'#ff4081':col+'66'};border:${ds===today?'2px solid #fff':inCI?'1px dashed #ff4081':'1px solid transparent'};color:${bleed?'#fff':'inherit'}">${d}${lg&&Object.keys(lg).length?'<i style="position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:9px;background:#fff"></i>':''}</button>`;
  }
  h+=`</div></div><div class="card flex flex-wrap gap-x-4 gap-y-1 text-xs">${Object.keys(PHC).map(k=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PHC[k]}"></i> ${t('ph.'+k)}</span>`).join('')}<span>${t('cal.legend.ci')}</span></div>
  <p class="sub">${t('cal.note')}</p>`;
  $('v-calendario').innerHTML=h;
}

function openDiary(d){dDate=d;go('diario')}
function renderDiary(){
  const l=logs[dDate]||{};
  const pill=(v,label,on,extra)=>`<span class="pill ${extra||''} ${on?'on':''}" data-v="${v}">${label}</span>`;
  $('v-diario').innerHTML=`<div class="card space-y-4">
  <div><label class="sub" for="dd">${t('d.date')}</label><input type="date" id="dd" value="${dDate}" max="${today}" onchange="if(this.value){dDate=this.value;render()}"></div>
  <div><p class="sub mb-1">${t('d.flow')}</p><div class="flex flex-wrap gap-2" id="fl">${FLOW.map(x=>pill(x,t('flow.'+x),l.flow===x)).join('')}</div></div>
  <div class="grid grid-cols-2 gap-3"><div><label class="sub" for="tp">${t('d.temp')}</label><input id="tp" type="number" inputmode="decimal" step="0.01" min="35" max="39" placeholder="36.45" value="${l.temp||''}"></div>
  <div><label class="sub" for="lh">${t('d.lh')}</label><select id="lh">${['','negativo','positivo'].map(o=>`<option value="${o}" ${l.lh===o?'selected':''}>${t('lh.'+o)}</option>`).join('')}</select></div></div>
  <div><label class="sub" for="mu">${t('d.mucus')}</label><select id="mu"><option value="">—</option>${MUC.map(o=>`<option value="${o}" ${l.mucus===o?'selected':''}>${t('mucus.'+o)}</option>`).join('')}</select></div>
  <div class="grid grid-cols-2 gap-3"><div><label class="sub" for="st">${t('d.stress')}: <b id="sv">${l.stress||3}</b></label><input type="range" id="st" min="1" max="5" value="${l.stress||3}" oninput="$('sv').textContent=this.value"></div>
  <div><label class="sub" for="sl">${t('d.sleep')}: <b id="qv">${l.sleep||3}</b></label><input type="range" id="sl" min="1" max="5" value="${l.sleep||3}" oninput="$('qv').textContent=this.value"></div></div>
  <div><p class="sub mb-1">${t('d.sex')}</p><div class="flex flex-wrap gap-2" id="si">${['no','si'].map(x=>pill(x,t('sex.'+x),l.intercourse===x)).join('')}</div></div>
  <div class="grid grid-cols-2 gap-3"><div><label class="sub" for="ac">${t('d.activity')}</label><select id="ac">${ACT.map(o=>`<option value="${o}" ${l.activity===o?'selected':''}>${t('act.'+o)}</option>`).join('')}</select></div>
  <div><label class="sub" for="me">${t('d.meds')}</label><input id="me" value="${esc(l.meds)}" placeholder="${esc(t('d.meds.ph'))}"></div></div>
  <div><p class="sub mb-1">${t('d.symptoms')}</p><div class="flex flex-wrap gap-2" id="sy">${SYM.map(x=>pill(x,t('sym.'+x),(l.symptoms||[]).includes(x))).join('')}</div></div>
  <div><p class="sub mb-1">${t('d.mood')}</p><div class="flex gap-2" id="mo">${MOOD.map(x=>pill(x,x,l.mood===x,'text-lg')).join('')}</div></div>
  <div><label class="sub" for="nt">${t('d.notes')}</label><textarea id="nt" rows="2">${esc(l.notes)}</textarea></div>
  <div class="flex gap-2"><button class="btn flex-1" onclick="saveDay()">${t('d.save')}</button><button class="btn2" onclick="delDay()">${t('d.delete')}</button></div></div>`;
  ['fl','mo','si'].forEach(id=>$(id).onclick=e=>{if(e.target.classList.contains('pill')){const was=e.target.classList.contains('on');[...$(id).children].forEach(c=>c.classList.remove('on'));if(!was)e.target.classList.add('on')}});
  $('sy').onclick=e=>{if(e.target.classList.contains('pill'))e.target.classList.toggle('on')};
}
function saveDay(){
  if(dDate>today){toast(t('toast.future'));return}
  const pick=id=>{const o=$(id).querySelector('.on');return o?o.dataset.v:''};
  const raw=$('tp').value.trim(),tv=parseFloat(raw);
  if(raw!==''&&(isNaN(tv)||tv<35||tv>39)){toast(t('toast.badtemp'));return}
  logs[dDate]={flow:pick('fl'),temp:raw===''?'':tv,lh:$('lh').value,mucus:$('mu').value,stress:+$('st').value,sleep:+$('sl').value,activity:$('ac').value,meds:$('me').value.slice(0,200),symptoms:[...$('sy').querySelectorAll('.on')].map(x=>x.dataset.v),mood:pick('mo'),notes:$('nt').value.slice(0,2000),intercourse:pick('si')};
  const e=logs[dDate];   // giorno senza alcun dato reale (solo valori di default): non salvarlo
  if(!e.flow&&e.temp===''&&!e.lh&&!e.mucus&&!e.mood&&!e.intercourse&&!e.meds&&!e.notes&&!e.symptoms.length&&e.activity==='nessuna'&&e.stress===3&&e.sleep===3)delete logs[dDate];
  saveState();toast(t('toast.saved'));render();
}
function delDay(){if(!confirm(t('confirm.delday')))return;delete logs[dDate];saveState();toast(t('toast.deleted'));render()}

// BMI
function calculateBMI(){
  const w=parseFloat($('s9').value),h=parseFloat($('s10').value);
  if(w>0&&h>0){
    const bmi=w/((h/100)*(h/100));$('bmi-value').textContent=(Math.round(bmi*10)/10).toFixed(1);
    const k=bmi<18.5?'under':bmi<25?'normal':bmi<30?'over':'obese';
    $('bmi-info').innerHTML=`<span style="color:${k==='normal'?'#10b981':'#ff4081'}">${t('bmi.'+k)}</span>`;$('bmi-container').style.display='block';
  }else{$('bmi-value').textContent='--';$('bmi-info').innerHTML='';$('bmi-container').style.display='none'}
}
function updateWeight(){$('o9').textContent=$('s9').value||'--';calculateBMI()}
function updateHeight(){$('o10').textContent=$('s10').value||'--';calculateBMI()}
function toggleInfo(){const d=$('info-details'),g=$('info-toggle'),open=d.style.display==='none'||d.style.display==='';d.style.display=open?'block':'none';g.textContent=open?'▲':'▼';$('info-btn').setAttribute('aria-expanded',open)}

function renderStats(){
  const cs=A.cycles,el=$('v-stats');
  if(!cs.length){el.innerHTML=`<div class="card sub">${t('s.empty')}</div>`;return}
  const vs=cs.slice(-12),mx=Math.max(50,...vs.map(c=>c.len))+2,H=140,W=340,bw=Math.max(3,Math.min(34,(W-20)/vs.length-6)),Y=v=>H-18-v/mx*(H-30);
  let g=`<rect x="0" y="${Y(A.ema+A.sd)}" width="${W}" height="${Y(A.ema-A.sd)-Y(A.ema+A.sd)}" fill="#b388ff22"/><line x1="0" x2="${W}" y1="${Y(A.ema)}" y2="${Y(A.ema)}" stroke="#b388ff" stroke-dasharray="4 3"/><text x="4" y="${Y(A.ema+A.sd)-3}" font-size="9" fill="#b388ff">EMA ${A.ema.toFixed(1)} ± σ ${A.sd.toFixed(1)}</text>`;
  vs.forEach((c,i)=>{const x=10+i*((W-20)/vs.length);g+=`<rect x="${x}" y="${Y(c.len)}" width="${bw}" height="${H-18-Y(c.len)}" rx="4" fill="${c.anomalous?'#ffb300':'#ff4081'}"/><text x="${x+bw/2}" y="${Y(c.len)-3}" font-size="9" fill="#e6e6ea" text-anchor="middle">${c.len}</text><text x="${x+bw/2}" y="${H-5}" font-size="8" fill="#9a9aa8" text-anchor="middle">${fd(c.start,{day:'numeric',month:'numeric'})}</text>`});
  const u=t('u.days');
  el.innerHTML=`<div class="card space-y-2"><h3 class="font-semibold text-sm">${t('s.title')}</h3><svg viewBox="0 0 ${W} ${H}" class="w-full">${g}</svg><p class="sub">${t('s.legend')}</p></div>
  <div class="grid grid-cols-3 gap-3 text-center"><div class="card"><p class="sub">${t('s.exp')}</p><b>${A.ema.toFixed(1)} ${u}</b></div><div class="card"><p class="sub">${t('s.sd')}</p><b>${A.sd.toFixed(2)}</b></div><div class="card"><p class="sub">${t('s.valid')}</p><b>${A.n}</b></div></div>
  <div class="card space-y-2"><h3 class="font-semibold text-sm">${t('s.list')}</h3>${cs.slice().reverse().map(c=>`<div class="flex items-center justify-between text-sm border-b py-1" style="border-color:var(--line)"><div><b>${fd(c.start,{day:'numeric',month:'short',year:'2-digit'})}</b> · ${c.len} ${u}${c.luteal?' · '+t('s.luteal',{n:c.luteal}):''}<p class="sub">${c.anomalous?t('s.anom')+' '+(c.auto?t('s.anomAuto'):t('s.anomMan')):t('s.ok')}${c.method?' · '+t('s.ovvia',{m:t('method.'+c.method)}):''}</p></div><button class="btn2 text-xs" onclick="toggleAn('${c.start}',${!c.anomalous})">${c.anomalous?t('s.include'):t('s.mark')}</button></div>`).join('')}</div>`;
}
function toggleAn(s,v){S.anomalous[s]=v;saveState();render();toast(v?t('toast.excl'):t('toast.incl'))}

function renderSet(){
  const age=S.age===''?'--':S.age,wt=S.weight===''?'--':S.weight,ht=S.height===''?'--':S.height;
  $('v-impost').innerHTML=`<div class="card space-y-4">
  <div class="space-y-2">
    <div><label class="sub" for="s1">${t('set.last')}</label><input type="date" id="s1" value="${S.lastPeriodDate}" max="${today}"></div>
  </div>
  <div class="space-y-2 sect">
    <div><label class="sub" for="s2">${t('set.cycle')}: <b id="o2">${S.cycleLength}</b></label><input type="range" id="s2" min="21" max="45" value="${S.cycleLength}" oninput="$('o2').textContent=this.value"></div>
    <div><label class="sub" for="s3">${t('set.period')}: <b id="o3">${S.periodLength}</b></label><input type="range" id="s3" min="2" max="9" value="${S.periodLength}" oninput="$('o3').textContent=this.value"></div>
  </div>
  <div class="space-y-2 sect">
    <div><label class="sub" for="s4">${t('set.lut')}</label><select id="s4" onchange="$('s5w').style.display=this.value==='manual'?'block':'none'"><option value="auto" ${S.lutealMode==='auto'?'selected':''}>${t('set.lut.auto')}</option><option value="manual" ${S.lutealMode==='manual'?'selected':''}>${t('set.lut.manual')}</option></select></div>
    <div id="s5w" style="display:${S.lutealMode==='manual'?'block':'none'}"><label class="sub" for="s5">${t('set.lut.days')}: <b id="o5">${S.lutealManual}</b></label><input type="range" id="s5" min="10" max="16" value="${S.lutealManual}" oninput="$('o5').textContent=this.value"></div>
  </div>
  <div class="space-y-2 sect">
    <div><label class="sub" for="s6">${t('set.alpha')}: <b id="o6">${S.alpha}</b></label><div class="sub" style="font-size:0.7rem;margin-top:0.2rem">${t('set.alpha.hint')}</div><input type="range" id="s6" min="0.1" max="0.7" step="0.05" value="${S.alpha}" oninput="$('o6').textContent=this.value"></div>
    <div><label class="sub" for="s7">${t('set.conf')}</label><select id="s7">${CONFS.map(c=>`<option value="${c}" ${S.confidence===c?'selected':''}>${Math.round(c*100)}%</option>`).join('')}</select></div>
  </div>
  <div class="space-y-2 sect">
    <div><label class="sub" for="s8">${t('set.age')}</label><input type="number" id="s8" min="13" max="55" value="${S.age}" placeholder="${esc(t('set.age.ph'))}" oninput="$('o8').textContent=this.value||'--'"></div>
    <div class="sub">${t('set.age.cur')}: <b id="o8">${age}</b> ${t('u.years')}</div>
    <div><label class="sub" for="s9">${t('set.weight')}</label><input type="number" id="s9" min="30" max="200" value="${S.weight}" placeholder="${esc(t('set.weight.ph'))}" oninput="updateWeight()"></div>
    <div class="sub">${t('set.weight.cur')}: <b id="o9">${wt}</b> kg</div>
    <div><label class="sub" for="s10">${t('set.height')}</label><input type="number" id="s10" min="100" max="220" value="${S.height}" placeholder="${esc(t('set.height.ph'))}" oninput="updateHeight()"></div>
    <div class="sub">${t('set.height.cur')}: <b id="o10">${ht}</b> cm</div>
    <div class="space-y-2" id="bmi-container" style="display:none">
      <div class="sub">${t('set.bmi')}</div>
      <div><b id="bmi-value">--</b></div>
      <div id="bmi-info" class="sub"></div>
    </div>
  </div>
  <div class="space-y-2 sect">
    <div><label class="sub" for="s11">${t('set.lang')}</label><select id="s11"><option value="auto" ${S.lang==='auto'?'selected':''}>${t('set.lang.auto')}</option><option value="it" ${S.lang==='it'?'selected':''}>Italiano</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></div>
  </div>
  <div class="space-y-2 sect">
    <button id="info-btn" class="flex justify-between items-center w-full text-left" aria-expanded="false" onclick="toggleInfo()">
      <span class="sub">${t('set.info')}</span><span id="info-toggle" class="sub">▼</span>
    </button>
    <div id="info-details" class="text-xs space-y-1 muted" style="margin-top:0.5rem;display:none">${t('set.info.text')}</div>
  </div>
  <button class="btn w-full" onclick="saveSet()">${t('set.save')}</button></div>
  <div class="card flex gap-2 flex-wrap"><button class="btn2" onclick="exportData()">${t('set.export')}</button><label class="btn2" style="display:inline-flex;align-items:center;cursor:pointer">${t('set.import')}<input type="file" accept="application/json,.json" hidden onchange="importData(this)"></label><button class="btn2" onclick="clearAll()">${t('set.clear')}</button></div>
  <div class="card space-y-3">
  <h3 class="font-semibold text-sm">${t('legal.title')}</h3>
  <div class="text-xs space-y-2 muted">
    <p>${t('legal.gpl')}</p>
    <p>${t('legal.med')}</p>
    <p>${t('legal.priv')}</p>
  </div>
</div>`;
  calculateBMI();
}
function clearAll(){if(!confirm(t('confirm.clear')))return;logs={};S=cleanSet({});saveState();applyLang();render();toast(t('toast.cleared'))}
function saveSet(){
  S=cleanSet({...S,lastPeriodDate:$('s1').value,cycleLength:$('s2').value,periodLength:$('s3').value,lutealMode:$('s4').value,lutealManual:$('s5').value,alpha:$('s6').value,confidence:$('s7').value,age:$('s8').value,weight:$('s9').value,height:$('s10').value,lang:$('s11').value});
  saveState();applyLang();go('oggi');toast(t('toast.recalc'));
}

function render(){A=E.analyze(logs,S,today);({oggi:renderOggi,calendario:renderCal,diario:renderDiary,stats:renderStats,impost:renderSet})[tab]();document.querySelectorAll('.pill').forEach(p=>{p.tabIndex=0;p.setAttribute('role','button')})}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pill')){e.preventDefault();e.target.click()}});
document.addEventListener('visibilitychange',()=>{const n=E.f(new Date());if(!document.hidden&&n!==today){const keep=dDate===today;today=n;if(keep)dDate=n;render()}});

// Service Worker Registration
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(e=>console.log('ServiceWorker registration failed: ',e))});
}

applyLang();
go('oggi');
</script>
</body>
</html>
